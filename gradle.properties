# Spesifikasi JVM args untuk proses daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Mengaktifkan AndroidX
android.useAndroidX=true

# Mengaktifkan Jetifier (jika ada library lama yang perlu dikonversi)
android.enableJetifier=true

# Gaya kode Kotlin (meskipun proyek Java, ini standar)
kotlin.code.style=official

# Mengaktifkan build cache (opsional, untuk mempercepat build)
org.gradle.caching=true
